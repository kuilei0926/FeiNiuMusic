name: build-release

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: |
          if [ -z "${ANDROID_KEYSTORE_BASE64}" ]; then
            echo "ANDROID_KEYSTORE_BASE64 is missing"
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      - run: flutter pub get
      - run: |
          FULL_VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          VERSION=${FULL_VERSION%%+*}
          echo "VERSION=$VERSION" >> $GITHUB_ENV
      # 1) 正式包：默认包名 com.feiniu.music，三个 CPU 架构全部保留
      - run: flutter build apk --release --split-per-abi
        env:
          SIGNING_STORE_FILE: release.keystore
          SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - run: |
          mv build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
             FeiNiuMusic-v${VERSION}-arm64-v8a.apk
          mv build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk \
             FeiNiuMusic-v${VERSION}-armeabi-v7a.apk
          mv build/app/outputs/flutter-apk/app-x86_64-release.apk \
             FeiNiuMusic-v${VERSION}-x86_64.apk
      # 2) 投音兼容包（非官方）：applicationId 覆盖为 com.luna.music，仅 arm64。
      #    用于鸿蒙 4/6、iQOO、VIVO 的播控中心显示投音控制（见 README 声明）。
      #    仅在 GitHub Actions 自动打包时产出，本地构建不做此覆盖。
      - run: flutter build apk --release --target-platform android-arm64 --android-project-arg applicationIdOverride=com.luna.music
        env:
          SIGNING_STORE_FILE: release.keystore
          SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - run: |
          mv build/app/outputs/flutter-apk/app-release.apk \
             FeiNiuMusic-v${VERSION}-arm64-v8a-luna.apk
      - run: |
          git log -1 --pretty=format:"- %s%n%b" > release_notes.txt
          if [ ! -s release_notes.txt ]; then
            echo "- ${GITHUB_SHA}" > release_notes.txt
          fi
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: v${{ env.VERSION }}
          body_path: release_notes.txt
          files: |
            FeiNiuMusic-v${{ env.VERSION }}-arm64-v8a.apk
            FeiNiuMusic-v${{ env.VERSION }}-armeabi-v7a.apk
            FeiNiuMusic-v${{ env.VERSION }}-x86_64.apk
            FeiNiuMusic-v${{ env.VERSION }}-arm64-v8a-luna.apk
